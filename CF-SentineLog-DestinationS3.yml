AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Sentinel Audit Account - CloudWatch Logs Destination + Firehose + Transform Lambda (.log.gz classic flow logs).

Parameters:
  StackSetName:
    Type: String
    Default: CF-SentinelAuditS3

  S3BucketAllEvents:
    Type: String
    Default: sentinel-vpcflowlog-123456789012-us-east-1

  S3Prefix:
    Type: String
    Default: "VPCFlowLog"

  OrgId:
    Type: String
    AllowedPattern: '^o-[a-z0-9]{10}$'
    Default: o-XXXXXXXXXXX

  SentinelDestinationName:
    Type: String
    Default: SentinelLogs

  FirehoseStreamName:
    Type: String
    Default: SentinelFirehose


Resources:
  ######################################################
  # Lambda Execution Role (for TransformLambda)
  ######################################################
  TransformLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SentinelTransformExtraPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow Lambda to re-ingest into Firehose (PutRecordBatch) when needed
              - Effect: Allow
                Action:
                  - firehose:PutRecordBatch
                Resource: "*"
              # Allow CloudWatch logs put if Lambda logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
      Tags:
        - Key: Project
          Value: Sentinel

  ##############################################
  # Transform Lambda (Node.js 18) - fixed handler code
  ##############################################
  TransformLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FirehoseStreamName
      Description: "Classic VPC Flow Log Transform for Sentinel S3"
      # Use a supported runtime; if nodejs24.x isn't available in your account, use nodejs18.x or nodejs20.x
      Runtime: nodejs18.x
      Handler: index.handler
      Timeout: 180
      MemorySize: 512
      Role: !GetAtt TransformLambdaRole.Arn
      Code:
        ZipFile: |

          "use strict";
          
          const zlib = require("zlib");
          
          // --- lightweight static syntax self-check (counts opening/closing braces at load)
          (function syntaxSelfCheck() {
          // This is a minimal shim to help detect truncated pastes in some editors.
          // It does not guarantee correctness, just prints a hint.
          const src = `
              const a = { x: [ (1 + 2) ] };
          `;
          // If this block fails to parse, loader would already throw; so we only log.
          try { new Function(src)(); } catch { console.log("Syntax self-check hint: loader parse error"); }
          })();
          
          // Extended VPC Flow Logs field count
          const EXPECTED_FIELD_COUNT = 25;
          
          // Optional header (usually remove for Firehose->S3 to save bytes)
          const CSV_HEADERS = [
          "version","account-id","interface-id","srcaddr","dstaddr","srcport","dstport",
          "protocol","packets","bytes","start","end","action","log-status","vpc-id",
          "subnet-id","instance-id","tcp-flags","type","pkt-srcaddr","pkt-dstaddr",
          "region","az-id","sublocation-type","sublocation-id"
          ].join(" ");
          
          // Per-record raw text cap (before gzip)
          const PER_RECORD_RAW_CAP_BYTES = 512 * 1024; // 512 KB
          
          // Firehose/Lambda sync hard limit for response payload
          const MAX_RESPONSE_BYTES = 6 * 1024 * 1024;
          
          /** Consistent size logging */
          function logBytes(label, bytes) {
          const kb = (bytes / 1024).toFixed(2);
          const mb = (bytes / (1024 * 1024)).toFixed(2);
          console.log(`${label}: ${bytes} bytes (${kb} KB, ${mb} MB)`);
          }
          
          exports.handler = async (event) => {
          // Batch size
          const batchSizeBytes = Buffer.byteLength(JSON.stringify(event), "utf8");
          logBytes("Incoming Firehose event size", batchSizeBytes);
          console.log(`Incoming record count: ${event.records?.length ?? 0}`);
          
          const output = [];
          let headerAdded = false; // only once per invocation if you keep headers
          
          try {
              for (const record of event.records || []) {
              // Input record base64 size
              const inputBase64Bytes = Buffer.byteLength(record.data, "base64");
              logBytes(`Input record ${record.recordId} (base64)`, inputBase64Bytes);
          
              // Step 1 — decode base64 -> maybe gunzip -> utf8
              let decoded;
              try {
                  const raw = Buffer.from(record.data, "base64");
                  try {
                  decoded = zlib.gunzipSync(raw).toString("utf8");
                  console.log(`Record ${record.recordId}: payload was gzipped`);
                  } catch {
                  decoded = raw.toString("utf8");
                  console.log(`Record ${record.recordId}: payload was plain text`);
                  }
              } catch (err) {
                  console.error(`Record ${record.recordId}: decode failed`, err);
                  output.push({ recordId: record.recordId, result: "Dropped" });
                  continue;
              }
          
              // parse wrapper
              let wrapper;
              try {
                  wrapper = JSON.parse(decoded);
              } catch (err) {
                  console.error(`Record ${record.recordId}: JSON parse failed`, err);
                  output.push({ recordId: record.recordId, result: "Dropped" });
                  continue;
              }
          
              // Step 2 — only DATA_MESSAGE
              if (wrapper.messageType !== "DATA_MESSAGE") {
                  console.warn(`Record ${record.recordId}: non-DATA_MESSAGE (${wrapper.messageType}), Dropped`);
                  output.push({ recordId: record.recordId, result: "Dropped" });
                  continue;
              }
          
              const events = wrapper.logEvents || [];
              if (events.length === 0) {
                  console.warn(`Record ${record.recordId}: no logEvents, Dropped`);
                  output.push({ recordId: record.recordId, result: "Dropped" });
                  continue;
              }
          
              // Step 3 — build lines with strict byte cap
              const lines = [];
              // Optional header (recommend removing to save bytes)
              if (!headerAdded) {
                  lines.push(CSV_HEADERS);
                  headerAdded = true;
              }
          
              let currentBytes = 0;
              for (const le of events) {
                  const msg = (le.message || "").trim();
                  if (!msg || msg.includes("NODATA")) continue;
          
                  const fields = msg.split(/\s+/);
                  if (fields.length !== EXPECTED_FIELD_COUNT) {
                  console.warn(`Record ${record.recordId}: dropping malformed line (${fields.length} fields)`);
                  continue;
                  }
          
                  const line = fields.join(" ");
                  const lineBytes = Buffer.byteLength(line, "utf8") + 1; // +1 for newline
          
                  if (currentBytes + lineBytes > PER_RECORD_RAW_CAP_BYTES) {
                  console.warn(`Record ${record.recordId}: reached per-record cap (${PER_RECORD_RAW_CAP_BYTES} bytes), truncating`);
                  break;
                  }
          
                  lines.push(line);
                  currentBytes += lineBytes;
              }
          
              // If only header was added and no valid lines, drop
              const headerOnly = headerAdded ? 1 : 0;
              if (lines.length <= headerOnly) {
                  console.warn(`Record ${record.recordId}: no valid lines, Dropped`);
                  output.push({ recordId: record.recordId, result: "Dropped" });
                  continue;
              }
          
              // Step 4 — prepare text and ALWAYS gzip
              const text = lines.join("\n") + "\n";
              const textBytes = Buffer.byteLength(text, "utf8");
              logBytes(`Record ${record.recordId} raw transformed text`, textBytes);
          
              let outBuf;
              try {
                  outBuf = zlib.gzipSync(Buffer.from(text, "utf8"));
              } catch (e) {
                  console.error(`Record ${record.recordId}: gzip failed`, e);
                  output.push({ recordId: record.recordId, result: "ProcessingFailed" });
                  continue;
              }
          
              logBytes(`Record ${record.recordId} gzip buffer`, outBuf.length);
              const outBase64 = outBuf.toString("base64");
              const outBase64Bytes = Buffer.byteLength(outBase64, "utf8");
              logBytes(`Record ${record.recordId} base64(gzip)`, outBase64Bytes);
          
              // Step 5 — one output per input, preserve recordId
              output.push({
                  recordId: record.recordId,
                  result: "Ok",
                  data: outBase64,
              });
              }
          
              // Step 6 — final response size check
              const resp = JSON.stringify({ records: output });
              const respBytes = Buffer.byteLength(resp, "utf8");
              logBytes("Final Lambda response JSON", respBytes);
          
              if (respBytes > MAX_RESPONSE_BYTES) {
              console.error("FINAL RESPONSE EXCEEDS MAX_RESPONSE_BYTES (6 MB hard limit)");
          
              // Print per-record output sizes for triage
              for (const rec of output) {
                  if (rec.data) {
                  const bytes = Buffer.byteLength(rec.data, "utf8");
                  logBytes(`Output record ${rec.recordId} base64 size`, bytes);
                  } else {
                  console.log(`Output record ${rec.recordId} has no data (result=${rec.result})`);
                  }
              }
          
              // Also show incoming record sizes (raw base64)
              for (const inRec of event.records || []) {
                  const inBytes = Buffer.byteLength(inRec.data, "base64");
                  logBytes(`Incoming record ${inRec.recordId} base64 size`, inBytes);
              }
          
              return {
                  records: (event.records || []).map((r) => ({
                  recordId: r.recordId,
                  result: "ProcessingFailed",
                  })),
              };
              }
          
              return { records: output };
          } catch (err) {
              console.error("FATAL ERROR", err);
          
              // Diagnostics on fatal error
              const resp = JSON.stringify({ records: output });
              logBytes("Response JSON at fatal error", Buffer.byteLength(resp, "utf8"));
          
              return {
              records: (event.records || []).map((r) => ({
                  recordId: r.recordId,
                  result: "ProcessingFailed",
              })),
              };
          }
          };
          
      Tags:
        - Key: Project
          Value: Sentinel

  ######################################################
  # Firehose Role (writes to S3 AND logs)
  ######################################################
  SentinelFirehoseStreamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FirehosePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # S3 access for delivery
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${S3BucketAllEvents}
                  - !Sub arn:aws:s3:::${S3BucketAllEvents}/*
              # Lambda processor invocation
              - Effect: Allow
                Action:
                  - lambda:GetFunctionConfiguration
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt TransformLambda.Arn
              # Firehose delivery logging to CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/kinesisfirehose/${FirehoseStreamName}-${AWS::Region}:*
      Tags:
      - Key: Project
        Value: Sentinel

  ######################################################
  # Firehose CloudWatch Log Group / Stream
  ######################################################
  FirehoseDeliveryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/kinesisfirehose/${FirehoseStreamName}-${AWS::Region}"
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: Sentinel

  FirehoseDeliveryLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseDeliveryLogGroup
      LogStreamName: !Sub "FirehoseDelivery-${AWS::Region}"

  ######################################################
  # Firehose Delivery Stream
  ######################################################
  FirehoseLogsDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamType: DirectPut
      DeliveryStreamName: !Sub "${FirehoseStreamName}-${AWS::Region}"
      ExtendedS3DestinationConfiguration:
        BucketARN: !Sub "arn:aws:s3:::${S3BucketAllEvents}"
        RoleARN: !GetAtt SentinelFirehoseStreamRole.Arn
        Prefix: !Sub "${S3Prefix}/"
        ErrorOutputPrefix: !Sub "Process-Failed/"
        BufferingHints:
          SizeInMBs: 2
          IntervalInSeconds: 30
        CompressionFormat: UNCOMPRESSED
        FileExtension: ".csv.gz"
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseDeliveryLogGroup
          LogStreamName: !Ref FirehoseDeliveryLogStream
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !GetAtt TransformLambda.Arn
                - ParameterName: RoleArn
                  ParameterValue: !GetAtt SentinelFirehoseStreamRole.Arn
      Tags:
        - Key: Project
          Value: Sentinel

  ######################################################
  # Lambda Invoke Permission - allow Firehose to invoke the Lambda
  ######################################################
  TransformLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt TransformLambda.Arn
      Action: lambda:InvokeFunction
      Principal: firehose.amazonaws.com
      SourceArn: !GetAtt FirehoseLogsDeliveryStream.Arn

  ######################################################
  # CloudWatch Logs -> Firehose Role (for Destination)
  ######################################################
  CWSentinelToFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LogDestinationToFirehose
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !GetAtt FirehoseLogsDeliveryStream.Arn
      Tags:
        - Key: Project
          Value: Sentinel

  ######################################################
  # CloudWatch Logs Destination (cross-account)
  ######################################################
  CloudWatchLogsDestination:
    Type: AWS::Logs::Destination
    DependsOn:
      - FirehoseLogsDeliveryStream
      - CWSentinelToFirehoseRole
    Properties:
      DestinationName: !Ref SentinelDestinationName
      TargetArn: !GetAtt FirehoseLogsDeliveryStream.Arn
      RoleArn: !GetAtt CWSentinelToFirehoseRole.Arn
      DestinationPolicy: !Sub |
        {
          "Version":"2012-10-17",
          "Statement":[
            {
              "Sid":"AllowOrgPutSubscriptionFilter",
              "Effect":"Allow",
              "Principal":"*",
              "Action":"logs:PutSubscriptionFilter",
              "Resource":"arn:aws:logs:${AWS::Region}:${AWS::AccountId}:destination:${SentinelDestinationName}",
              "Condition":{
                "StringEquals":{"aws:PrincipalOrgID":"${OrgId}"}
              }
            }
          ]
        }

Outputs:
  FirehoseDeliveryStreamName:
    Value: !Ref FirehoseLogsDeliveryStream

  CloudWatchDestinationArn:
    Value: !GetAtt CloudWatchLogsDestination.Arn

  TransformLambdaArn:
    Value: !GetAtt TransformLambda.Arn
