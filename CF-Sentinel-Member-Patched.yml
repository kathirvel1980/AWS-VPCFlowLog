AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Member Account Template (updated).
  - Creates CloudWatch Log Group Sentinel-VPCFlowLog-All
  - Creates region-scoped FlowLog role + SubscriptionAttach role
  - Creates role Sentinel-FlowLog-Manager-<region> for central tooling Lambda
  - Creates SubscriptionFilter to Audit destination
  - Creates Event rule for sentinel.vpc.discovery and CreateVpc forwarding to tooling bus
  - Adds cross-account invocation role for EventBridge (for same-account targets)
  - Automatically triggers discovery ONCE during CREATE via Custom Resource

Parameters:
  ToolingAccountId:
    Type: String
    Default: "123456789032"
    Description: Account ID where Tooling Lambda runs (central automation)
    AllowedPattern: '^[0-9]{12}$'
    MinLength: 12
    MaxLength: 12

  AuditAccountId:
    Type: String
    Default: "123456789012"
    Description: Audit Account ID hosting CloudWatch Logs Destination (firehose/other)
    AllowedPattern: '^[0-9]{12}$'
    MinLength: 12
    MaxLength: 12

  DestinationName:
    Type: String
    Default: SentinelLogs
    Description: CloudWatch Logs Destination name in Audit account

  LambdaName:
    Type: String
    Default: SentinelTriggerVPC
    Description: Prefix for the central Lambda functions

Conditions:
  IsToolingAccount: !Equals [ !Ref AWS::AccountId, !Ref ToolingAccountId ]

Resources:

  ####################################################################
  # CloudWatch Log Group
  ####################################################################
  SentinelVPCFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: "Sentinel-VPCFlowLog-All"
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: Sentinel

  ####################################################################
  # FlowLog Role
  ####################################################################
  SentinelFlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Sentinel-FlowLog-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FlowLogRolePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: "*"
      Tags:
        - Key: Project
          Value: Sentinel

  ####################################################################
  # SubscriptionAttach Role
  ####################################################################
  SentinelSubscriptionAttachRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Sentinel-SubscriptionAttachRole-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SubscriptionAttachPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:PutSubscriptionFilter
                  - logs:DeleteSubscriptionFilter
                  - logs:DescribeLogGroups
                Resource: "*"
      Tags:
        - Key: Project
          Value: Sentinel

  ####################################################################
  # Subscription Filter -> Audit Destination
  ####################################################################
  SentinelSubscriptionFilter:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: SentinelVPCFlowLogGroup
    Properties:
      LogGroupName: !Ref SentinelVPCFlowLogGroup
      FilterPattern: "- \"NODATA\""
      FilterName: !Sub "Sentinel-FlowLogs-${AWS::Region}"
      DestinationArn: !Sub "arn:aws:logs:${AWS::Region}:${AuditAccountId}:destination:${DestinationName}"
      RoleArn: !GetAtt SentinelSubscriptionAttachRole.Arn

  ####################################################################
  # Role for Central Tooling Lambda (FlowLog Manager)
  ####################################################################
  SentinelFlowLogManagerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Sentinel-FlowLog-Manager-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:aws:iam::${ToolingAccountId}:root"
                - !If
                  - IsToolingAccount
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/Tooling-FlowLogLambdaRole-${AWS::Region}"
                  - !Ref "AWS::NoValue"
            Action: sts:AssumeRole

      Policies:
        - PolicyName: FlowLogManagerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateFlowLogs
                  - ec2:DescribeFlowLogs
                  - ec2:DescribeVpcs
                  - ec2:CreateTags
                  - ec2:DeleteFlowLogs
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/Sentinel-FlowLog-role-${AWS::Region}"
      Tags:
        - Key: Project
          Value: Sentinel

  ####################################################################
  # AUTO-DISCOVERY AT STACK CREATE
  ####################################################################
  DiscoveryInitRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Sentinel-DiscoveryInitRole-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AllowEventBridgePutEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub "arn:aws:events:${AWS::Region}:${ToolingAccountId}:event-bus/sentinel"

  ####################################################################
  # DISCOVERY LAMBDA FUNCTION
  ####################################################################
  DiscoveryInitFunction:
    Type: AWS::Lambda::Function
    DependsOn: DiscoveryInitRole
    Properties:
      FunctionName: !Sub "SentinelFlowlog-${AWS::Region}"
      Handler: index.handler
      Runtime: python3.11
      Timeout: 60
      Role: !GetAtt DiscoveryInitRole.Arn
      Environment:
        Variables:
          TOOLING_ACCOUNT_ID: !Ref ToolingAccountId
      Code:
        ZipFile: |
          import boto3, json, os, urllib3
          http = urllib3.PoolManager()

          def send(event, context, status, data):
              http.request(
                  "PUT", event["ResponseURL"],
                  body=json.dumps({
                      "Status": status,
                      "Reason": "See logs",
                      "PhysicalResourceId": context.log_stream_name,
                      "StackId": event["StackId"],
                      "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"],
                      "Data": data
                  }),
                  headers={"content-type":"application/json"}
              )

          def handler(event, context):
              if event["RequestType"] != "Create":
                  send(event, context, "SUCCESS", {"ignored": True})
                  return
              region = os.environ["AWS_REGION"]
              account = boto3.client("sts").get_caller_identity()["Account"]
              bus = f"arn:aws:events:{region}:{os.environ['TOOLING_ACCOUNT_ID']}:event-bus/sentinel"
              events = boto3.client("events", region_name=region)
              detail = {"source":"sentinel.vpc.discovery", "region": region, "account": account}
              resp = events.put_events(Entries=[{
                  "Source":"sentinel.vpc.discovery",
                  "DetailType":"DiscoveryManualTrigger",
                  "Detail":json.dumps(detail),
                  "EventBusName": bus
              }])
              send(event, context, "SUCCESS", {"response": resp})

  DiscoveryInit:
    Type: Custom::DiscoveryInit
    DependsOn: DiscoveryInitFunction
    Properties:
      ServiceToken: !GetAtt DiscoveryInitFunction.Arn

  ####################################################################
  # Forwarding EventBridge Rules (member -> tooling)
  ####################################################################
  EventBridgeToToolingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Sentinel-EventBridgeToTooling-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowPutEventsToToolingSentinel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !Sub "arn:aws:events:${AWS::Region}:${ToolingAccountId}:event-bus/sentinel"
      Tags:
        - Key: Project
          Value: Sentinel
  
  ####################################################################
  # Forwarding EventBridge Rules (member -> tooling)
  ####################################################################
  ForwardDiscoveryToTooling:
    Type: AWS::Events::Rule
    Properties:
      Description: "Forward sentinel.vpc.discovery events to tooling account sentinel bus"
      EventPattern:
        source:
          - sentinel.vpc.discovery
      Targets:
        - Id: ToToolingBusDiscovery
          Arn: !Sub "arn:aws:events:${AWS::Region}:${ToolingAccountId}:event-bus/sentinel"
          RoleArn: !GetAtt EventBridgeToToolingRole.Arn

  ForwardCreateVpcToTooling:
    Type: AWS::Events::Rule
    Properties:
      Description: "Forward CloudTrail CreateVpc events to tooling account sentinel bus"
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - ec2.amazonaws.com
          eventName:
            - CreateVpc
      Targets:
        - Id: ToToolingBusCreateVpc
          Arn: !Sub "arn:aws:events:${AWS::Region}:${ToolingAccountId}:event-bus/sentinel"
          RoleArn: !GetAtt EventBridgeToToolingRole.Arn

Outputs:
  LogGroupName:
    Value: !Ref SentinelVPCFlowLogGroup

  FlowLogRoleArn:
    Value: !Sub "arn:aws:iam::${AWS::AccountId}:role/Sentinel-FlowLog-role-${AWS::Region}"

  ManagerRoleArn:
    Value: !GetAtt SentinelFlowLogManagerRole.Arn
